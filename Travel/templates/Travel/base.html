
{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

   <title>
    {% block title %}MakeMyTrip | Book Flights, Hotels & Holidays{% endblock %}
</title>
    <!-- Common CSS -->
    <link rel="stylesheet"
          href="{% static 'travel/css/style.css' %}">

    <!-- Navbar CSS -->
    <link rel="stylesheet"
          href="{% static 'travel/css/navbar.css' %}">

    <!-- Page-specific CSS -->
    {% block extra_css %}{% endblock %}

</head>

<body>

    <!-- Shared Navbar -->
    {% include 'travel/partials/navbar.html' %}

    <!-- Main Page Content -->
    <main class="main-content">

        {% block content %}
        {% endblock %}

    </main>

    <!-- Shared Footer -->
    {% include 'travel/partials/footer.html' %}

    <!-- Common JavaScript -->
    <script src="{% static 'travel/js/main.js' %}"></script>

    <!-- Page-specific JavaScript -->
    {% block extra_js %}{% endblock %}

</body>

</html>
