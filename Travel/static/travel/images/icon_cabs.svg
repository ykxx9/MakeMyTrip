<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Cab body -->
  <rect x="4" y="22" width="40" height="16" rx="4" fill="#F9A825"/>
  <!-- Roof/cabin -->
  <path d="M10 22 L14 10 L34 10 L38 22Z" fill="#F57F17"/>
  <!-- Taxi sign -->
  <rect x="18" y="6" width="12" height="6" rx="2" fill="#212121"/>
  <text x="24" y="11" text-anchor="middle" font-size="4.5" fill="#FDD835" font-family="Arial" font-weight="bold">TAXI</text>
  <!-- Windows -->
  <rect x="13" y="13" width="9" height="8" rx="1.5" fill="#B3E5FC"/>
  <rect x="26" y="13" width="9" height="8" rx="1.5" fill="#B3E5FC"/>
  <!-- Wheels -->
  <circle cx="13" cy="40" r="6" fill="#212121"/>
  <circle cx="13" cy="40" r="3" fill="#616161"/>
  <circle cx="35" cy="40" r="6" fill="#212121"/>
  <circle cx="35" cy="40" r="3" fill="#616161"/>
  <!-- Door line -->
  <line x1="24" y1="22" x2="24" y2="36" stroke="#F57F17" stroke-width="1.5"/>
  <!-- Headlight -->
  <rect x="40" y="27" width="4" height="4" rx="1" fill="#FFF176"/>
  <!-- Tail light -->
  <rect x="4" y="27" width="3" height="4" rx="1" fill="#EF5350"/>
</svg>
