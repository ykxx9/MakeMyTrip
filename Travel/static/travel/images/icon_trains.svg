<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Train body -->
  <rect x="4" y="12" width="40" height="22" rx="4" fill="#C62828"/>
  <!-- Front cab -->
  <rect x="34" y="14" width="8" height="18" rx="3" fill="#B71C1C"/>
  <!-- Windows -->
  <rect x="8" y="16" width="8" height="8" rx="1" fill="#B3E5FC"/>
  <rect x="20" y="16" width="8" height="8" rx="1" fill="#B3E5FC"/>
  <rect x="36" y="16" width="4" height="6" rx="1" fill="#B3E5FC"/>
  <!-- White stripe -->
  <rect x="4" y="27" width="40" height="4" fill="#EF9A9A"/>
  <!-- Wheels -->
  <circle cx="12" cy="36" r="5" fill="#424242"/>
  <circle cx="12" cy="36" r="2.5" fill="#757575"/>
  <circle cx="28" cy="36" r="5" fill="#424242"/>
  <circle cx="28" cy="36" r="2.5" fill="#757575"/>
  <circle cx="40" cy="36" r="4" fill="#424242"/>
  <circle cx="40" cy="36" r="2" fill="#757575"/>
  <!-- Rail line -->
  <rect x="2" y="40" width="44" height="2" rx="1" fill="#616161"/>
  <!-- Pantograph top -->
  <line x1="20" y1="12" x2="16" y2="6" stroke="#616161" stroke-width="1.5"/>
  <line x1="20" y1="12" x2="24" y2="6" stroke="#616161" stroke-width="1.5"/>
  <line x1="14" y1="6" x2="26" y2="6" stroke="#616161" stroke-width="2"/>
</svg>
